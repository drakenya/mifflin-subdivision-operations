[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "waybill-generator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "click>=8",
    "pydantic>=2",
    "reportlab>=4",
    "pyyaml>=6",
    "openpyxl>=3",
    "xlrd>=2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
waybill = "waybill_generator.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff", "httpx2>=2"]

[tool.ruff]
line-length = 100
target-version = "py311"
